name: Attested release build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
    steps:
      - name: Prepare the pinned Arch build environment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s\n' \
            'Server = https://archive.archlinux.org/repos/2026/08/28/$repo/os/$arch' \
            >/etc/pacman.d/mirrorlist
          pacman --sync --refresh --refresh --sysupgrade --noconfirm \
            dbus git github-cli openssl rust systemd
          useradd --create-home --user-group builder

      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag signature and release identity
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          gpg --batch --quiet --import RELEASE-SIGNING-KEY.asc
          git -c safe.directory="$GITHUB_WORKSPACE" verify-tag "$GITHUB_REF_NAME"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" \
            rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"

      - name: Prepare the unprivileged build owner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          chown --recursive builder:builder "$GITHUB_WORKSPACE"

      - name: Build and test the exact source
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          runuser --user builder -- env \
            HOME=/home/builder \
            CARGO_HOME=/home/builder/.cargo \
            "$GITHUB_WORKSPACE/packaging/release/build-release" \
            "$version" "$GITHUB_WORKSPACE/dist"

      - name: Attest the package provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.pkg.tar.zst

      - name: Assemble immutable draft release
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="$(find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          cp -- "${{ steps.provenance.outputs.bundle-path }}" \
            "$package.intoto.jsonl"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum -- >SHA256SUMS
          )
          printf '%s\n' \
            'CI-built package and exact-tag source for Proton VPN for Omarchy.' \
            '' \
            'The package has GitHub/Sigstore build provenance. This release' \
            'remains a draft until the unchanged package and checksum manifest' \
            'receive detached signatures from the published release key.' \
            >release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Proton VPN for Omarchy Core ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md dist/*
